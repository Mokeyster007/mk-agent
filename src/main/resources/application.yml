spring:
  application:
    name: mk-agent

  profiles:
    active: local

  # ===========================================================
  # 对话模型的装配完全由项目代码负责：
  #   - 未配 mkagent.model.base-url → DashScopeChatModelConfig
  #   - 配了 mkagent.model.base-url → OpenAiCompatibleChatModelConfig
  # 因此排除 DashScope 的对话模型自动配置。否则它会按"类型 DashScopeChatModel
  # 是否缺失"再创建一个 ChatModel，与项目自己选的实现、以及"谁来决定重试模板"
  # 纠缠在一起（一次 400 被重试 8 次的根因就出在这条链路上）。
  #
  # 只排除"对话"：Embedding / Image 的自动配置保持原样。
  # ===========================================================
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration

  # AgentRun 建表脚本：启动时执行，语句全部幂等（IF NOT EXISTS）。
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000

    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 60s

       ##stdio:
        ##  servers-configuration: classpath:mcp-servers.json

        sse:
          connections:
            server1:
              url: http://localhost:8127

    # ===========================================================
    # Spring AI 的 HTTP 状态码 → 异常类型映射（由 ResponseErrorHandler 使用）。
    # 默认 4xx 全部映射为 NonTransientAiException（不重试），
    # 但 429 是"限流"而非"参数错误"，属于可自愈失败，
    # 这里显式把它归入 TransientAiException，与 5xx 走同一条有限重试路径。
    # 真正的重试次数/退避由 mkagent.model-retry 决定（见下方）。
    # ===========================================================
    retry:
      on-http-codes:
        - 429

server:
  port: 8123
  servlet:
    context-path: /api

# =============================================================
# Actuator：只暴露 health 端点，不暴露 env/beans/heapdump 等敏感端点。
# 生产环境若需进一步收敛，可将 show-details 改为 never。
# =============================================================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# =============================================================
# MkAgent 弹性与成本观测配置。
# =============================================================
mkagent:
  agent:
    # 全局最大并发 Agent 任务数（Semaphore 许可数）。
    max-concurrency: 8
    # 剩余步数 ≤ 该值时，向模型追加一条"请收尾"的系统提示
    # （只追加到发送给模型的副本，不写进任务消息历史）。
    # 背景：预算耗尽时模型常常还在搜索新资料，最后一句回答都没写。
    # 设为 0 或负数可关闭该提示。
    budget-warning-steps: 2
    # -------------------------------------------------------------
    # MkManus 预算（按 agent 分组，默认 8 步 / 12 次工具 / 2 分钟）。
    # 上限保护：max-steps ≤ 30、max-tool-calls ≤ 60、timeout ≤ 30m；
    # 非法值（≤0 或超过上限）会告警并回退默认值，避免配置笔误导致成本失控。
    # -------------------------------------------------------------
    manus:
      max-steps: 8
      max-tool-calls: 12
      timeout: 2m
      # SSE 连接在 Agent 超时之后额外保留的时间（合法范围 1s ~ 5m，越界回退 30s）。
      # emitter 超时 = timeout + sse-buffer = 150s。
      # 不能让两者相等：Agent 超时后还要推 TIMED_OUT 状态与 DONE，
      # 容器异步超时先到会把这几条事件吞掉，前端只看到连接被掐断。
      #
      # ⚠️ 前置 nginx / LB 的 proxy_read_timeout（默认 60s）必须大于
      #    emitter 超时（150s），否则连接会先被反代掐断，本配置等于没生效。
      sse-buffer: 30s
    # 预算耗尽（MAX_STEPS_REACHED / 工具次数上限）且尚无最终回答时，
    # 额外执行一次"不带工具"的模型调用，让模型基于已有信息总结尽力而为的回答，
    # 并在答案前标注"(因步数预算耗尽，以下为基于已获取信息的尽力回答)"。
    # 该调用消耗的 Token 照常计入 Usage；状态仍记为 MAX_STEPS_REACHED。
    # 关闭（false）则保持旧行为：返回步骤摘要。
    force-final-answer: true

  # ===========================================================
  # 模型分层（OpenAI 兼容接口）。
  #
  # 默认整块注释掉 = 不启用，继续使用 DashScope 原生客户端。
  # 取消注释并填上 base-url 即切换：
  #   agent     主推理（Agent 用）
  #   auxiliary 评测打分 / 查询改写等短调用；name 留空则回退 agent 的模型名
  #   vision    多模态；name 留空则回退 agent 的模型名
  #
  # 三者共用 base-url / api-key，但各自持有**独立的** RetryTemplate 实例，
  # 不与容器里的 RetryTemplate Bean 共享对象（见 OpenAiCompatibleChatModelConfig）。
  # ===========================================================
  # model:
  #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api-key: ${MKAGENT_MODEL_API_KEY:}
  #   agent:
  #     name: qwen-plus
  #     temperature: 0.7
  #   auxiliary:
  #     name: qwen-turbo
  #     temperature: 0.0
  #   vision:
  #     name: qwen-vl-plus

  # ===========================================================
  # 模型调用重试（DashScopeChatModel 实际使用的 RetryTemplate）。
  # 只重试"可能自愈"的失败：5xx / 429 / 网络超时；
  # 400 参数错误、401/403 鉴权、欠费属于 NonTransientAiException，一次都不重试，
  # 直接让任务 FAILED，避免白等几分钟后撞上 Agent 总超时。
  # ===========================================================
  model-retry:
    # 含首次调用；3 = 首次 + 最多 2 次重试。
    max-attempts: 3
    # 首次退避 1s，之后 2s（指数，封顶 max-backoff）。
    initial-backoff: 1s
    multiplier: 2.0
    max-backoff: 2s
    # 网络超时（ResourceAccessException）是否重试。
    retry-on-timeout: true

  # ===========================================================
  # RAG 知识库：让应用启动与大模型可用性解耦。
  # 向量库构建会调用对话模型（关键词提取）与 Embedding 模型，
  # 因此默认改为 lazy，启动阶段不发起任何模型调用。
  # ===========================================================
  rag:
    # false：不注册向量库 Bean、不调用任何模型，RAG 接口返回 503。
    enabled: true
    # lazy ：第一次 RAG 调用时才构建（默认）；
    # eager：启动阶段构建，失败只标记不可用，不影响应用启动。
    init-mode: lazy
    # 本地向量库持久化文件。SimpleVectorStore 是内存实现，
    # 不落盘的话每次启动都要重新做关键词提取 + Embedding（真实花钱）。
    # 同目录下会自动生成 *.index.json 侧车索引，两者必须成对存在。
    store-path: tmp/vector-store/chat-app-vector-store.json
    # 嵌入模型标识（写入侧车索引）。留空则使用 EmbeddingModel 实现类名；
    # DashScope 换模型时类名不变，建议显式填写，或直接删除 store 目录。
    embedding-model: ""
    keyword-enrich:
      # 关闭后入库不再调用对话模型（每片段省一次调用），只做 Embedding。
      enabled: true

  rate-limit:
    # 用户级限流开关与阈值：每分钟最多发起多少次 Agent 请求。
    enabled: true
    max-requests: 10
    window-seconds: 60
  tool-retry:
    # 只对安全、只读、幂等的工具自动重试。
    enabled: true
    max-attempts: 3
    initial-backoff-millis: 200
    multiplier: 2.0
    retryable-tools: web_search,web_scrape
    # 工具吞异常返回失败文案时的识别关键词（工具名:关键词，包含匹配）。
    failure-markers: web_search:搜索工具执行失败,web_scrape:网页抓取失败
    # 重试耗尽后的行为：
    #   return（默认）—— 返回一条脱敏失败文案给模型，任务继续，
    #                     模型可换地址/换工具或调用 terminate_task 收尾；
    #   throw         —— 向上抛异常，整个任务直接 FAILED（旧行为，仅用于回滚）。
    # 真实运行里 web_scrape 抓 GitHub 超时，旧行为会把任务直接判失败，
    # 而一次抓取超时不该终止任务，因此默认改为 return。
    on-exhausted: return
    # 同一工具 + 同一目标主机允许连续重试耗尽的次数（站点级熔断）。
    # 达到后，后续对同一目标的调用不再真正执行，
    # 直接返回"该站点连续失败，请换用其他来源或在无法完成时调用 terminate_task"。
    # 背景：on-exhausted=return 之后任务不会失败，但模型会反复撞同一个打不开的站点，
    # 出现过 MAX_STEPS_REACHED、28308 Token 的任务。设为 0 或负数可关闭该保护。
    max-exhausted-per-target: 2

  # ===========================================================
  # 具体工具的配置。
  # ===========================================================
  tools:
    web-scrape:
      # 单页抓取超时（毫秒）。默认 10 秒对中文站点够用，
      # 但 GitHub / MDN 这类境外站点首字节返回慢，容易稳定超时，
      # 需要时调大（例如 30000）而不是改代码。
      timeout-ms: 10000
      # 单次抓取返回给模型的字符上限（正文 + 页面链接区块合计）。
      # 超长正文会截断，但"页面链接"区块优先保留：
      # 链接是引用来源的唯一可靠依据，正文尾部丢了不影响引用正确性。
      max-chars: 12000

  # ===========================================================
  # 离线评测配置（AgentEvaluator）。
  # 与线上 agent.max-concurrency / rate-limit 完全独立：
  # 评测使用自己的 Semaphore，不占用线上许可。
  # ===========================================================
  eval:
    # 是否允许运行评测；真实评测 runner 还需 -Dmkagent.eval.enabled=true。
    enabled: false
    # 评测专用并发闸门许可数。
    max-concurrency: 2
    # 用例文件位置（测试资源中提供）。
    cases-path: classpath:eval/cases.json
    # Markdown 报告输出路径。
    report-path: target/eval-report/agent-eval-report.md
    # LLM-as-judge 开关与温度。
    judge-enabled: true
    judge-temperature: 0.0
    # 评委提示词中最终回答的最大字符数。
    judge-max-answer-chars: 4000
    # 单条用例最大执行时间（秒）。
    case-timeout-seconds: 120
    # ---------------------------------------------------------------
    # 评测专用预算策略（默认全部关闭，避免改变被测行为与历史口径）：
    # budget-warning-steps：剩余步数不足时是否追加收尾提示，0 = 关闭；
    #   负值按 0 处理并告警。M4 对比实验可临时设为 1~3。
    # force-final-answer：预算耗尽后是否再问模型一次；默认 false，
    #   因为该调用不改变 MAX_STEPS_REACHED 的失败判定，只会增加 Token
    #   并可能挤占后续用例的整轮预算。设为 true 仅用于专项实验。
    # ---------------------------------------------------------------
    budget-warning-steps: 0
    force-final-answer: false
    # 整轮预算保护：任一项超限即停止启动新用例，剩余用例记为"预算跳过"。
    # 0 表示不限。默认值按"32 条用例全量跑完"估算，避免误跑烧额度。
    # ---------------------------------------------------------------
    # Agent 模型 + LLM judge 的 Token 总上限。
    max-total-tokens: 2000000
    # 整轮墙钟时长上限（秒）。
    max-duration-seconds: 1800
    # 最多执行多少条用例（0 = 全部），用于冒烟跑。
    max-cases: 0

# ===========================================================
# 搜索服务（searchapi.io）。
# api-key 属于密钥，放在 application-local.yml，不写进本文件。
# ===========================================================
search-api:
  # 搜索引擎，默认 baidu（保持既有行为与配额口径不变）。
  # 查英文官方文档（Spring AI / OpenAI / MDN docs）时改成 google，
  # 结果相关性与覆盖面明显更好；中文资讯场景保持 baidu。
  engine: baidu

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.example.mkagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.example.mkagent.advisor: DEBUG

